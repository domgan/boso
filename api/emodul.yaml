openapi: 3.0.3
info:
  title: eModul API Version 1.0
  description: |
    <details>
       <summary><b>Data types format</b></summary>
             - value type = -1: Value invisible.<br>
             - value type = 0: Ordinary value.<br>
             - value type = 1: Seconds.<br>
             - value type = 2: Minutes.<br>
             - value type = 3: Hours.<br>
             - value type = 4: Decimal value. The value should be transformed according to the formula <i>value  / 10</i><br>
             - value type = 5: hundredth value. The value should be transformed according to the formula <i>value  / 100</i><br>
             - value type = 6: Degrees Celsius.<br>
             - value type = 7: Tenth degrees Celsius. The value should be transformed according to the formula <i>value  / 10</i> <br>
             - value type = 8: Percentages.<br>
             - value type = 9: Promile.<br>
             - value type = 10: kW.<br>
             - value type = 11: kWh.<br>
             - value type = 12: Volts.<br>
             - value type = 13: Time written as hours * 60 + min, shown as 00:00 - 23:59<br>
             - value type = 14: Days<br>
             - value type = 15: Run<br>
             - value type = 16: Time in seconds shown as XXmin XXsec<br>
             - value type = 17: Time in minutes shown as XXhrs XXmin<br>
             - value type = 18: Inscription from CN Description Base, or flame brightness in status history [0-8000]<br>
             - value type = 19: kWh value with a decimal point<br>
             - value type = 20: MWh value<br>
             - value type = 21: MWh value with a decimal point.The value should be transformed according to the formula <i>value  / 10</i><br>
             - value type = 22: L / min value with decimals.The value should be transformed according to the formula <i>value  / 10</i><br>
             - value type = 23: pressure in bar with decimals.The value should be transformed according to the formula <i>value  / 10</i><br>
             - value type = 24: time point = ux epoch (integer)<br>
             - value type = 25: Time in seconds shown as XX days, XX hours. XX min. XX sec. The value should be transformed value/86400 for days, value/3600 for hours and value/60 for minutes<br>
             - value type = 26: kW with a decimal point. The value should be transformed according to the formula <i>value  / 10</i><br>
             - value type = 27: RPM<br>
             - value type = 28: Enabled / Disabled - [1/0]. The value should be transformed for example <i>value = value === 1 ? subtitle(Text.On) : subtitle(Text.Off)</i><br>
             - value type = 29: Watt<br>
             - value type = 30: L / hr value with decimals. The value should be transformed according to the formula <i><i>value  / 100</i></i><br>
             - value type = 31: Time in hours shown as XX days, XX hrs. The value should be transformed for example (JavaScript) <i>if (typeof value === 'number') {const [hour, day] = getHoursAndDays(value);value =(day > 0? ${doubleDigits(Math.round(day))} ${subtitle(Text.Days)} : '') + ${doubleDigits(hour)} ${subtitle(Text.Hour)} ${subtit};}</i><br>
             - value type = 32: K (Kelvin)<br>
             - value type = 33: Percentage with decimals<br>
             - value type = 34: Wh<br>
             - value type = 35: Value converted to HEX (0-F)<br>
             - value type = 36: kWh value with hundredth. The value should be transformed according to the formula <i>value  / 100</i><br>
             - value type = 37: XX Years XX days (sent as years * 365 + days)<br>
             - value type = 38: COP value with decimal places<br>
             - Value type = 39: Value l / m<br>
             - value type = 40: kWh value with thousandths. The value should be transformed according to the formula <i>value  / 1000</i><br>
             - value type = 41: liters.
             - value type = 42: cubic meters. 
     </details>
     <details>
        <summary><b>Description of zone parameters</b></summary>
                 <pre><b>"zone"</b>: {
                 <pre>
                 "id": 121,
                 "parentId": 1500,
                 "time": "2023-02-06T11:21:02.846309",
                 "duringChange": false,
                 "index": 1,
                 "currentTemperature": 223,
                 "setTemperature": 215,
                 "flags": {
                     "relayState": "off",
                     "minOneWindowOpen": false,
                     "algorithm": "heating",
                     "floorSensor": 0,
                     "humidityAlgorytm": 0,
                     "zoneExcluded": 0
                     </pre>
                 },</pre>
     </details>
     <details>
        <summary><b>Module types</b></summary>
                  - value type = 0: pellet<br>
                  - value type = 1: zones_controller<br>
                  - value type = 2: coal<br>
                  - value type = 3: solar<br>
                  - value type = 4: heat_pump<br>
                  - value type = 5: recuperator<br>
                  - value type = 6: fireplace<br>
                  - value type = 7: installation<br>
                  - value type = 8: gas_boiler<br>
                  - value type = 9: climaconvector<br>
                  - value type = 10: recuperator verano<br>
                  - value type = 11: zones_system_controller<br>
    
     </details>
