
post:
  tags:
    - Authentication
  summary: Authentication token
  description: |
    ### Response data example: 
     ``{authenticated: true, user_id: 240471648, token: .eyJ1c2VybmFtZSI6InRlc3QiLCJ1c2VyX2lkIjoyNDA0NzE2NDgsImlhdCI6MTUyNjk5ODQxOX0.opQW1yTczP7vuiIkI1Skuy8yJ8eGhYrlYUKmll9P88M}
     ``
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/User'

  responses:
    '200':
      description: successful operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Token'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            properties:
              authenticated:
                type: string
                example: false
get:
  tags:
    - Authentication
  summary: Authentication state
  description: |
    ### Response data example: 
     ``{authenticated: true}
     ``
  responses:
    '200':
      description: successful operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthState'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            properties:
              authenticated:
                type: string
                example: false

components:
  schemas:
    User:
      type: object
      properties:
        username:
          type: string
          example: 'test'
        password:
          type: string
          example: 'test'
    Token:
      type: object
      properties:
        authenticated:
          type: string
          example: true
        user_id:
          type: integer
          format: int64
          example: 240471648
        access_google_home:
          type: string
          example: false
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VybmFtZSI6InRlc3QiLCJ1c2VyX2lkIjoyNDA0NzE2NDgsImlhdCI6MTUyNjk5ODQxOX0.opQW1yTczP7vuiIkI1Skuy8yJ8eGhYrlYUKmll9P88M"
    AuthState:
      properties:
        authenticated:
          type: boolean
          example: true