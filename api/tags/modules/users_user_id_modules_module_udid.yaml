get:
  tags:
    - Modules
  summary: Module data
  description: |
    Endpoint for fetching module data. 
    
    ```json
      {
      "zones": { // pertains to `zones_controller` and `zones_system_controller`
        "transaction_time": null,
        "elements": [],
        "globalSchedules": {
          "time": null,
          "duringChange": null,
          "elements": []
        },
        "controllerParameters": { 
          "controllerMode": {},
          "globalSchedulesNumber": {}
        },
        "system": { // pertains to `zones_system_controller`
            "iterator": {
                "9000": "9000,0,100" // Iterator: Iterator object for the system controller. The object is a string with the following format: "Container_ID,Parent_ID,Type"
            },
            "containers": [
                {
                    "containerId": 9002, // containerId
                    "parentId": 9000, // parentId is the Container_ID of the parent object
                    "textId": 0, //  Text_ID: Text ID from the database
                    "iconId": 0, // Icon_ID: Icon ID from the database
                    "wikiId": 0, // Wiki_ID: Wiki text ID from the database
                    "version": "1.0.16", // Version: Controller software version in the format x.x.x
                    "containerName": "Moduł główny", // ame encoded in HEX. Character limit 15.
                    "processorId": "9C0613EB", //Processor_ID: Generated device processor address as in WTP3
                    "visibility": 1 // Visibility flag. Due to the inability to remove objects from the database, a visibility flag was introduced to hide/remove all elements associated with the container object.
                }
            ],
            "containersData": [
                {
                    "parameterId": 9003, // parameterId
                    "parentId": 9002, // parentId is the containerId of the parent object
                    "type": 0, // Device type: Device type in the system (Allows clear specification of “connection”)
                                  0 - Master [M]
                                  1 - Slave 1 [S1]
                                  2 - Slave 2 [S2]
                                  3 - Slave 3 [S3]
                                  4 - Slave 4 [S4]
                                  5 - Slave 5 [S5]
                    "signal": 100, // Signal: - signal strength. For Master, the signal refers to the Master<>ControlPanel link. For SlaveX, it refers to the Master<>SlaveX link.
                                      -3 Communication loss alarm
                                      -2 Wired communication
                                      -1 Default, waiting
                                      0-100 percentage value of signal strength
                    "pumpsState": true, // Pumps state: Current pump relay state (boolean type value; true=Active)
                    "pumpsConnection": { // Pumps connection: A set of flags whose shift represents the enum value of the device sharing the algorithm. (detailed description below).
                        "0": true,
                        "1": true,
                        "2": false
                    },
                    "freeContactState": true, // FreeContact state: Current two-state relay state (boolean type value; true = Heating/Cooling needed based on H/C State)
                    "freeContactConnection": { // FreeContact connection: A set of flags whose shift represents the enum value of the device sharing the algorithm. (detailed description below)
                        "0": true,
                        "1": true,
                        "2": true
                    },
                    "hcState": true, //  H/C state: Current two-state heating/cooling input state (boolean type value true=heating / false=cooling )
                    "hcConnection": { // H/C connection: A set of flags whose shift represents the enum value of the device sharing the algorithm. (detailed description below)
                        "0": false,
                        "1": true,
                        "2": true
                    }
                },
            ],
            "containerParameters": [],
            "additionalContacts": [],
            "duringChange": [],
            "options": {}
         } 
      },
      "tiles": {} // pertains to every controller type
      }
    ```  
   

    Where:
    - 'zones' - zones data for zones_controller and zones_system_controller.
    - `transaction_time` - transaction time for zones when available.
    - `elements` - list of zone elements.
    - `globalSchedules` - global schedules.
    - `controllerParameters` - controller parameters for zones.
    - `system` - system data for drivers zones_system_controller
    - `tiles` - list of tiles for every controller type.
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: module_udid
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: successful operation
      content:
        application/json [Type 1]:
          schema:
            $ref: '#/components/schemas/ModuleData1'
        application/json [Type 2]:
          schema:
              $ref: '#/components/schemas/ModuleData2'
        application/json [Type 3]:
          schema:
              $ref: '#/components/schemas/ModuleData3'
        application/json [Type 6]:
          schema:
              $ref: '#/components/schemas/ModuleData6'
        application/json [Type 11]:
          schema:
              $ref: '#/components/schemas/ModuleData11'
        application/json [Type 21]:
          schema:
              $ref: '#/components/schemas/ModuleData21'
        application/json [Type 22]:
          schema:
              $ref: '#/components/schemas/ModuleData22'
        application/json [Type 23]:
          schema:
              $ref: '#/components/schemas/ModuleData23'
        application/json [Type 31]:
          schema:
              $ref: '#/components/schemas/ModuleData31'
        application/json [Type 32]:
          schema:
              $ref: '#/components/schemas/ModuleData32'
        application/json [Type 40]:
          schema:
              $ref: '#/components/schemas/ModuleData40'
        application/json [Type 41]:
          schema:
              $ref: '#/components/schemas/ModuleData41'
        application/json [Type 50]:
          schema:
              $ref: '#/components/schemas/ModuleData50'
        application/json [Type 51]:
          schema:
              $ref: '#/components/schemas/ModuleData51'
        application/json [Type 60]:
          schema:
              $ref: '#/components/schemas/ModuleData60'
        application/json [Type 61]:
          schema:
              $ref: '#/components/schemas/ModuleData61'
        application/json [Type 100]:
          schema:
              $ref: '#/components/schemas/ModuleData100'
        application/json [Type 250]:
          schema:
              $ref: '#/components/schemas/ModuleData250'
        application/json [Type 251]:
          schema:
              $ref: '#/components/schemas/ModuleData251'
        application/json [Type 252] OpenTherm:
          schema:
              $ref: '#/components/schemas/ModuleData252'
    '400':
      description: Invalid ID supplied
    '404':
      description: Module not found

delete:
  tags:
    - Modules
  summary: Delete module
  parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - name: module_udid
      in: path
      required: true
      schema:
        type: integer
        format: int64
  operationId: Delete module

  responses:
    '200':
      description: successful operation

